[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statute-watch"
version = "0.1.0"
description = "Tracker of US state privacy-law changes, filterable by state and data type."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Charlie Krug" }]
keywords = ["privacy", "legislation", "biometric", "geolocation", "data-broker"]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "hypothesis>=6.0",
]

[project.scripts]
statute-watch = "statute_watch.cli:main"

[project.urls]
Homepage = "https://github.com/ctkrug/statute-watch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
statute_watch = ["../../templates/*", "../../data/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
